---
- name: Initialize the first control plane
  hosts: kube_control_plane[0]
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/cluster_vars.yml"
  environment:
    KUBECONFIG: "{{ kubernetes_admin_conf }}"
  tasks:
    - name: Check whether the control plane is already initialized
      ansible.builtin.stat:
        path: "{{ kubernetes_admin_conf }}"
      register: control_plane_admin_conf

    - name: Bootstrap a new control plane
      when: not control_plane_admin_conf.stat.exists
      block:
        - name: Read installed kubeadm version
          ansible.builtin.command: kubeadm version -o short
          register: installed_kubeadm_version
          changed_when: false

        - name: Create bootstrap configuration directory
          ansible.builtin.file:
            path: "{{ kubernetes_bootstrap_dir }}"
            state: directory
            mode: "0700"

        - name: Render kubeadm initialization configuration
          ansible.builtin.template:
            src: templates/kubeadm-init.yaml.j2
            dest: "{{ kubernetes_bootstrap_dir }}/kubeadm-init.yaml"
            mode: "0600"
            validate: kubeadm config validate --config %s

        - name: Initialize the cluster
          ansible.builtin.command:
            argv:
              - kubeadm
              - init
              - --config
              - "{{ kubernetes_bootstrap_dir }}/kubeadm-init.yaml"
            creates: "{{ kubernetes_admin_conf }}"
          # kubeadm prints a join token on success.
          no_log: true

    - name: Wait for the API server
      ansible.builtin.command: kubectl --request-timeout=10s get --raw=/readyz
      register: api_readiness
      changed_when: false
      until: api_readiness.rc == 0
      retries: 30
      delay: 5

    - name: Look up the local administrator account
      ansible.builtin.getent:
        database: passwd
        key: "{{ kubernetes_admin_user }}"

    - name: Create the administrator's kubeconfig directory
      ansible.builtin.file:
        path: "{{ getent_passwd[kubernetes_admin_user][4] }}/.kube"
        state: directory
        owner: "{{ kubernetes_admin_user }}"
        group: "{{ getent_passwd[kubernetes_admin_user][2] }}"
        mode: "0700"

    - name: Install the administrator's kubeconfig
      ansible.builtin.copy:
        src: "{{ kubernetes_admin_conf }}"
        dest: "{{ getent_passwd[kubernetes_admin_user][4] }}/.kube/config"
        remote_src: true
        owner: "{{ kubernetes_admin_user }}"
        group: "{{ getent_passwd[kubernetes_admin_user][2] }}"
        mode: "0600"
        force: false
      no_log: true
